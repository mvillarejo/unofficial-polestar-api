name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev --extra ha

      - name: Run the offline test suite
        # `-m 'not live'` comes from pyproject's addopts, so the live tests that
        # need real credentials and a real car never run here.
        run: uv run pytest -q
